# Enable AVX2/FMA/F16C so the on-device model uses candle's SIMD kernels.
# Every x86-64 CPU from 2013 onwards (Intel Haswell, AMD Excavator/Zen) supports these.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+avx,+avx2,+fma,+f16c"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+avx,+avx2,+fma,+f16c"]
